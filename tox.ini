[tox]
envlist = py{36,37,38,39,310}-sqlalchemy{13}
skipsdist = true


[testenv]
deps =
    pytest
    pytest-cov
    mysqlclient>=1.3.7
    cymysql
    pymysql
    sqlalchemy13: sqlalchemy>=1.3
commands =
    py.test {posargs}

setenv =
    CC_SPHINX_HOST = {env:CC_SPHINX_HOST:127.0.0.1}
    CC_SPHINX_PORT = {env:CC_SPHINX_PORT:9008}

passenv =
    TRAVIS
    TRAVIS_JOB_ID
    TRAVIS_BRANCH


[pytest]
addopts = -s -l --color=yes -vv --ff --durations=5 --cov-fail-under=97 --cov-config .coveragerc --cov=sqlalchemy_sphinx
norecursedirs = .git _build tmp* .tox .eggs env/
python_files=test*.py
