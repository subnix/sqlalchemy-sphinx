language: python
matrix:
  include:
    - python: "3.6"
      env: TOX_ENV="py36-sqlalchemy{13,14}"
    - python: "3.7"
      env: TOX_ENV="py37-sqlalchemy{13,14}"
      dist: xenial
    - python: "3.8"
      env: TOX_ENV="py38-sqlalchemy{13,14}"
      dist: xenial
    - python: "3.9"
      env: TOX_ENV="py39-sqlalchemy{13,14}"
      dist: xenial
    - python: "3.10"
      env: TOX_ENV="py310-sqlalchemy{13,14}"
      dist: xenial
    - python: "3.11"
      env: TOX_ENV="py310-sqlalchemy{13,14}"
      dist: xenial
    - python: "3.12"
      env: TOX_ENV="py310-sqlalchemy{13,14}"
      dist: xenial
    - python: "3.13"
      env: TOX_ENV="py310-sqlalchemy{13,14}"
      dist: xenial
install:
  - pip install tox
  - pip install coveralls
script:
  - tox -e $TOX_ENV
after_success:
  - coveralls
